name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Start Kimai environment
        run: docker compose up -d --wait
        timeout-minutes: 5

      - name: Restore
        run: dotnet restore KimaiDotNet.Reporting.sln

      - name: Build
        run: dotnet build KimaiDotNet.Reporting.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/KimaiDotNet.Reporting.ODataService.Tests/ --no-build --configuration Release

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs
